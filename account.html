<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Snap Shoes - Account</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{font-family:Segoe UI, Arial, sans-serif; background:#f8f9fa}
    .card{border-radius:12px}
    .small-note{font-size:0.9rem;color:#6c757d}
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
    <div class="container">
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#navbarOffcanvas" aria-controls="navbarOffcanvas">
        <span class="navbar-toggler-icon"></span>
      </button>
      <a class="navbar-brand fw-bold text-white ms-2" href="index.html">👟 SNAP SHOES</a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <a href="index.html" class="text-white text-decoration-none" title="Home">🏠</a>
        <a href="shop.html" class="text-white text-decoration-none" title="Shop">🛍️</a>
      </div>
    </div>
  </nav>
  <div class="offcanvas offcanvas-start" tabindex="-1" id="navbarOffcanvas" aria-labelledby="navbarOffcanvasLabel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title fw-bold" id="navbarOffcanvasLabel">👟 SNAP SHOES</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item mb-3"><a class="nav-link fw-bold" href="index.html">Home</a></li>
        <li class="nav-item mb-3"><a class="nav-link fw-bold" href="shop.html">Shop</a></li>
        <li class="nav-item mb-3"><a class="nav-link fw-bold" href="about.html">About Us</a></li>
        <li class="nav-item mb-3"><a class="nav-link fw-bold" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card p-4 mb-4">
          <h3 class="fw-bold">Account</h3>
          <p class="small-note">Create an account or view your profile.</p>
          <div id="profileArea" class="mt-3"></div>
        </div>

        <div class="card p-4">
          <h5 class="mb-3">Register</h5>
          <form id="regForm" autocomplete="off">
            <div class="mb-3">
              <label class="form-label">Full name</label>
              <input id="name" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input id="email" type="email" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Phone</label>
              <input id="phone" class="form-control" required pattern="[0-9+\- ]{7,20}" />
            </div>
            <div class="mb-3">
              <label class="form-label">Mobile</label>
              <input id="mobile" class="form-control" required pattern="[0-9+\- ]{7,20}" />
            </div>
            <div class="mb-3">
              <label class="form-label">Full address</label>
              <textarea id="address" rows="3" class="form-control" required></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Captcha: <span id="captchaQuestion" class="fw-bold"></span></label>
              <div class="input-group">
                <input id="captchaAnswer" class="form-control" required />
                <button type="button" id="refreshCaptcha" class="btn btn-outline-secondary">↻</button>
              </div>
            </div>
            <div class="d-grid">
              <button id="submitBtn" class="btn btn-dark">Create account</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="account.js"></script>
  <script>
    (function(){
      const profileArea = document.getElementById('profileArea');
      const form = document.getElementById('regForm');
      const captchaQ = document.getElementById('captchaQuestion');
      const captchaInput = document.getElementById('captchaAnswer');
      const refresh = document.getElementById('refreshCaptcha');
      let currentCaptcha = window.SnapAccount.generateCaptcha();
      function renderProfile(){
        const user = window.SnapAccount.getUser();
        if(user){
          profileArea.innerHTML = `
            <div class="card p-3 mb-3">
              <h5 class="mb-1">Hello, ${escapeHtml(user.name)}</h5>
              <p class="mb-1 small-note">${escapeHtml(user.email)} • ${escapeHtml(user.mobile||user.phone||'')}</p>
              <p class="mb-1">${escapeHtml(user.address)}</p>
              <div><button id="logoutBtn" class="btn btn-outline-danger btn-sm">Log out</button></div>
            </div>`;
          const logoutBtn = document.getElementById('logoutBtn');
          logoutBtn.addEventListener('click', ()=>{ window.SnapAccount.clearUser(); renderProfile(); alert('Logged out'); });
        } else {
          profileArea.innerHTML = '';
        }
      }

      function escapeHtml(s){ return String(s).replace(/[&<>\"]/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

      function setNewCaptcha(){ currentCaptcha = window.SnapAccount.generateCaptcha(); captchaQ.textContent = currentCaptcha.question; captchaInput.value = ''; }

      refresh.addEventListener('click', setNewCaptcha);
      setNewCaptcha();
      renderProfile();

      form.addEventListener('submit', function(e){
        e.preventDefault();
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const mobile = document.getElementById('mobile').value.trim();
        const address = document.getElementById('address').value.trim();
        const captchaVal = parseInt(captchaInput.value,10);
        if(!name || !email || !address) return alert('Please fill required fields');
        if(captchaVal !== currentCaptcha.answer) { alert('Captcha incorrect'); setNewCaptcha(); return; }
        const user = { name, email, phone, mobile, address, createdAt: Date.now() };
        window.SnapAccount.setUser(user);
        alert('Account created — welcome '+name.split(' ')[0]);
        renderProfile();
      });
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
